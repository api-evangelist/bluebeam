apis:
  - aid: bluebeam:bluebeam-studio-api
    name: Bluebeam Studio API
    tags:
      - Collaboration
      - Construction
      - Drawing
      - Markup
      - PDF
      - Review
      - Studio
    image: https://raw.githubusercontent.com/api-evangelist/bluebeam/refs/heads/main/image.png
    humanURL: https://developers.bluebeam.com/
    baseURL: https://api.bluebeam.com
    properties:
      - url: https://developers.bluebeam.com/
        type: Documentation
      - url: https://support.bluebeam.com/developer/getting-started-dev-portal.html
        type: GettingStarted
      - url: https://support.bluebeam.com/developer/authentication-guide.html
        type: Authentication
      - url: https://support.bluebeam.com/developer/studio-session-guide.html
        type: Reference
      - url: https://raw.githubusercontent.com/api-evangelist/bluebeam/refs/heads/main/openapi/bluebeam-studio-openapi.yml
        type: OpenAPI
    description: >-
      The Bluebeam Studio API enables programmatic access to Studio Sessions for document
      collaboration, markup management, and PDF review workflows. OAuth 2.0 REST APIs
      allow third-party applications to create and manage studio sessions, retrieve
      markup data, and integrate document annotations into AEC construction workflows.

  - aid: bluebeam:bluebeam-studio-prime-api
    name: Bluebeam Studio Prime Integration API
    tags:
      - Construction
      - Drawing
      - Markup
      - PDF
      - Project Management
      - Studio Prime
    image: https://raw.githubusercontent.com/api-evangelist/bluebeam/refs/heads/main/image.png
    humanURL: https://developers.bluebeam.com/
    baseURL: https://api.bluebeam.com
    properties:
      - url: https://support.bluebeam.com/integrations/develop-integrations.html
        type: Documentation
      - url: https://support.bluebeam.com/developer/getting-started-dev-portal.html
        type: GettingStarted
      - url: https://support.bluebeam.com/developer/authentication-guide.html
        type: Authentication
      - url: https://support.bluebeam.com/integrations/int-overview.html
        type: Documentation
    description: >-
      The Bluebeam Studio Prime Integration API leverages the Bluebeam Public API
      to enable third-party application integrations with Studio Prime. APIs support
      programmatic access to project drawing sets, session management, and markup
      synchronization for construction project management platforms.

